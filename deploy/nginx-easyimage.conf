# =====================================================================
# EasyImage 2.0 简单图床 - Nginx 站点配置模板
# ---------------------------------------------------------------------
# 变更日志 (Change Log)
#   日期: 2026-10-07
#   内容: 新增本文件, 配合 deploy/setup.sh 使用
#   原因: 之前 Nginx 配置只存在于 CT 虚拟机的 /etc/nginx/sites-available/,
#         没有沉淀进项目, 换机器部署会丢。现在作为项目模板, 部署到哪台
#         新机器都自动生成同样的配置。
#   用法: 不要直接手动使用本文件! 由 setup.sh 自动替换占位符并安装到
#         /etc/nginx/sites-available/easyimage
#   2026-10-07 追加: 增加 /.well-known/acme-challenge/ 放行(供 certbot 签
#         证书用); 说明 IPv6 代理配置由 proxy_apply.php 自动生成到
#         /etc/nginx/conf.d/ 和 /etc/nginx/stream.d/, 不在本文件里手写。
# ---------------------------------------------------------------------
# 占位符说明:
#   __WEBROOT__ 会被 setup.sh 替换成实际网站根目录(如 /var/www/easyimage)
#
# 【与 IPv6 代理功能的关系】本文件只负责"图床主站"(default_server)。
#   IPv6 反代的 server 块(各子域名 + TCP 端口转发)由后台"IPv6代理"页面
#   配置, 由 root 定时任务 proxy_apply.php 自动生成到:
#     /etc/nginx/conf.d/easyimage-proxy-http.conf   (七层, 在 http{} 内被 include)
#     /etc/nginx/stream.d/easyimage-proxy-tcp.conf  (四层, 在 stream{} 内被 include)
#   两者互不干扰: 主站用 server_name _ 兜底, 代理用具体子域名匹配。
# =====================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __WEBROOT__;
    index index.php index.html;

    # 上传大文件时 Nginx 层的总限制(与 PHP 的 post_max_size 配套)
    client_max_body_size 100M;

    access_log /var/log/nginx/easyimage_access.log;
    error_log  /var/log/nginx/easyimage_error.log;

    # PHP 文件交给 php8.1-fpm 解析
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 【安全核心】图片目录 i/ 禁止执行任何 PHP 文件。
    # 原理: 图床允许访客上传文件, 如果有人上传了伪装成图片的木马脚本
    # (.php), 这条规则保证浏览器访问它时只会下载/403, 绝不会被执行。
    # 注意: Nginx 不读 Apache 的 .htaccess, 项目自带的 i/.htaccess 在
    # Nginx 下是无效的, 必须靠这条 location 实现同等防护, 千万不能删。
    location ^~ /i/ {
        location ~ \.php$ {
            deny all;
            return 403;
        }
    }

    # 【certbot 证书验证放行】Let's Encrypt 签发/续期证书时, 会访问
    # http://域名/.well-known/acme-challenge/xxx 来验证域名所有权。
    # 这个路径指向 /var/www/certbot(与 IPv6 代理功能共用同一验证目录)。
    # 不加这条, 主站是 default_server 会拦截所有未匹配域名的请求,
    # 导致 certbot 验证失败、证书签不下来。
    #
    # 【为什么必须写 ^~】Nginx 匹配顺序是: 精确 > ^~前缀 > 正则 ~ > 普通前缀。
    # 下面那条"禁止隐藏文件"用的是正则 location ~ /\. , 而 ACME 路径里
    # 恰好含有 /.well-known (带点), 会被那条正则抢先匹配并 404 掉。
    # ^~ 的含义是"本前缀一旦命中, 立即停止搜索正则", 从而绕过隐藏文件规则。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 禁止访问所有隐藏文件(.htaccess / .git / install.lock 等)
    location ~ /\. {
        deny all;
        return 404;
    }

    # 普通页面: 先找文件, 找不到再交给 index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
